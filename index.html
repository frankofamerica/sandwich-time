<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07080f">
  <title>Sandwich Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="left-ctrl">
      <div id="dpad" aria-label="Direction pad">
        <span class="arrow up"></span><span class="arrow down"></span>
        <span class="arrow left"></span><span class="arrow right"></span>
      </div>
    </div>
    <div id="stage"><canvas id="game"></canvas></div>
    <div id="right-ctrl">
      <div class="small-btns">
        <button id="btn-pause" aria-label="Pause">II</button>
        <button id="btn-mute" aria-label="Mute">&#9835;</button>
      </div>
      <button id="btn-pepper">PEPPER</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/level.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
