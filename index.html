<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07080f">
  <title>Sandwich Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="left-ctrl">
      <div id="dpad" aria-label="Direction pad">
        <span class="arrow up"></span><span class="arrow down"></span>
        <span class="arrow left"></span><span class="arrow right"></span>
      </div>
    </div>
    <div id="stage"><canvas id="game"></canvas></div>
    <div id="right-ctrl">
      <div class="small-btns">
        <button id="btn-pause" aria-label="Pause">II</button>
        <button id="btn-mute" aria-label="Mute">&#9835;</button>
      </div>
      <button id="btn-pepper">PEPPER</button>
    </div>
  </div>

  <dialog id="name-dialog" class="st-dialog" aria-labelledby="name-title">
    <form id="name-form">
      <h2 id="name-title">NEW HIGH SCORE!</h2>
      <p class="place" id="name-place"></p>
      <p class="place-sub" id="name-place-sub"></p>
      <p class="big" id="name-score"></p>
      <label for="name-input">ENTER YOUR NAME</label>
      <input id="name-input" type="text" maxlength="20" autocomplete="nickname" autocapitalize="characters"
             autocorrect="off" spellcheck="false" enterkeyhint="done">
      <p class="msg" id="name-msg" role="status"></p>
      <div class="row">
        <button type="button" id="name-skip" class="secondary">SKIP</button>
        <button type="submit" id="name-submit">SUBMIT</button>
      </div>
    </form>
  </dialog>

  <dialog id="scores-dialog" class="st-dialog" aria-labelledby="scores-title">
    <h2 id="scores-title">TOP 10</h2>
    <ol id="scores-list"></ol>
    <p class="msg" id="scores-msg" role="status"></p>
    <div class="row"><button type="button" id="scores-close">CLOSE</button></div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/scores.js"></script>
  <script src="js/level.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
